<!DOCTYPE html>
<html xml:lang="es">
  <head>
    <title>Sumador</title>
  </head>
  <body>
    <h1>Sumador</h1>
    <form id="sumar-form">
      <label for="primer-numero">Primer número:</label>
      <input type="number" id="primer-numero" />
      <label for="segundo-numero">Segundo número:</label>
      <input type="number" id="segundo-numero" />
      <input type="submit" value="Sumar" id="sumar-button" />
    </form>

    <h1>Ventas</h1>
    <form id="formulario-ventas">
      <label for="cantidad-items">Cantidad de items: </label>
      <input type="number" id="cantidad-items"/>
      <label for="precio-item">Precio del item</label>
      <input type="number" id="precio-item">
      <label for="codigo-estado">Codigo estado</label>
      <input type="number" id="codigo-estado">
    </form>
    <div id="resultado-div"></div>

    <script type="module" src="./src/presenter.js"></script>
  </body>
</html>
